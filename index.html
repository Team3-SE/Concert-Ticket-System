<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIXORA — Concert Ticketing System (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d14;
    --surface:#16161f;
    --surface-alt:#1d1d29;
    --surface-hover:#23232f;
    --border:#2a2a38;
    --text:#f1f1f6;
    --text-muted:#9494a6;
    --accent:#ff2e6a;
    --accent-dim:#4d1226;
    --accent-2:#ffb020;
    --accent-3:#37e2c4;
    --danger:#ff5c5c;
    --radius:12px;
    --radius-sm:8px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Prompt",-apple-system,sans-serif;
    font-weight:400;
    min-height:100vh;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--accent); color:#fff; }

  /* ---------- Layout shells ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  .storefront-shell{ display:flex; flex-direction:column; min-height:100vh; }
  .backoffice-shell{ display:flex; min-height:100vh; }

  /* ---------- Topbar (Public/Customer) ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 32px;
    border-bottom:1px solid var(--border);
    background:rgba(13,13,20,0.9);
    backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:40;
    gap:20px; flex-wrap:wrap;
  }
  .logo{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:20px; letter-spacing:.02em; }
  .logo .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .nav-links{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .nav-link{
    padding:8px 14px; border-radius:20px; font-size:14px; color:var(--text-muted);
    transition:.15s; white-space:nowrap;
  }
  .nav-link:hover{ background:var(--surface-alt); color:var(--text); }
  .nav-link.active{ background:var(--accent-dim); color:var(--accent); font-weight:500; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }

  /* ---------- Role switcher (demo aid) ---------- */
  .role-switch{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    padding:6px 10px; border-radius:20px; font-size:12px; color:var(--text-muted);
  }
  .role-switch select{
    background:transparent; color:var(--text); border:none; font-family:inherit;
    font-size:12px; font-weight:600; outline:none; cursor:pointer;
  }
  .role-switch select option{ background:var(--surface-alt); color:var(--text); }

  /* ---------- Backoffice sidebar (Organizer/Admin) ---------- */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px;
    position:sticky; top:0; height:100vh;
  }
  .sidebar .logo{ padding:0 10px 20px; }
  .side-section-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); padding:14px 10px 6px; }
  .side-link{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm);
    font-size:14px; color:var(--text-muted); margin-bottom:2px; transition:.15s;
  }
  .side-link:hover{ background:var(--surface-alt); color:var(--text); }
  .side-link.active{ background:var(--accent-dim); color:var(--accent); font-weight:500; }
  .side-link .ic{ width:18px; text-align:center; opacity:.9; }
  .sidebar-footer{ margin-top:auto; }

  .backoffice-main{ flex:1; min-width:0; }
  .backoffice-topbar{
    padding:16px 32px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:rgba(13,13,20,0.9); backdrop-filter:blur(8px); z-index:30;
  }
  .backoffice-topbar h2{ margin:0; font-size:18px; font-weight:600; }
  .breadcrumb{ font-size:12px; color:var(--text-muted); }

  /* ---------- Page container ---------- */
  .page{ padding:36px 32px 80px; max-width:1180px; margin:0 auto; width:100%; }
  .page-narrow{ max-width:480px; }
  .page-header{ margin-bottom:28px; }
  .page-header h1{ font-size:26px; margin:0 0 6px; font-weight:700; }
  .page-header p{ color:var(--text-muted); margin:0; font-size:14px; }
  .eyebrow{ font-size:12px; color:var(--accent); font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; }

  /* ---------- Hero (Home) ---------- */
  .hero{
    position:relative; overflow:hidden;
    background:
      radial-gradient(60% 90% at 20% 0%, rgba(255,46,106,0.28), transparent 60%),
      radial-gradient(50% 80% at 90% 10%, rgba(255,176,32,0.18), transparent 60%),
      var(--surface);
    border-bottom:1px solid var(--border);
    padding:70px 32px;
  }
  .hero-inner{ max-width:720px; margin:0 auto; text-align:center; }
  .hero h1{ font-size:44px; font-weight:700; line-height:1.15; margin:0 0 14px; }
  .hero h1 span{ color:var(--accent); }
  .hero p{ color:var(--text-muted); font-size:16px; margin:0 0 28px; }
  .hero-search{
    display:flex; gap:8px; background:var(--surface-alt); border:1px solid var(--border);
    padding:6px; border-radius:40px; max-width:520px; margin:0 auto;
  }
  .hero-search input{
    flex:1; background:transparent; border:none; outline:none; color:var(--text);
    padding:10px 14px; font-family:inherit; font-size:14px;
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 20px; border-radius:24px; font-size:14px; font-weight:600;
    border:1px solid transparent; transition:.15s;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:#ff4b7e; }
  .btn-secondary{ background:var(--surface-alt); color:var(--text); border-color:var(--border); }
  .btn-secondary:hover{ background:var(--surface-hover); }
  .btn-ghost{ background:transparent; color:var(--text-muted); }
  .btn-ghost:hover{ color:var(--text); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:7px 14px; font-size:12px; border-radius:18px; }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:rgba(255,92,92,0.1); }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }

  /* ---------- Card / grid ---------- */
  .grid{ display:grid; gap:20px; }
  .grid-3{ grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; transition:.15s;
  }
  .card:hover{ border-color:#3a3a4a; transform:translateY(-2px); }
  .card-media{
    height:130px;
    background:linear-gradient(135deg, var(--m1,#ff2e6a), var(--m2,#ffb020));
    display:flex; align-items:flex-end; padding:12px;
  }
  .card-media .tag{ background:rgba(0,0,0,0.4); font-size:11px; padding:4px 10px; border-radius:20px; backdrop-filter:blur(4px); }
  .card-body{ padding:16px; }
  .card-body h3{ margin:0 0 6px; font-size:16px; }
  .card-meta{ color:var(--text-muted); font-size:12.5px; line-height:1.7; }
  .card-footer{ display:flex; align-items:center; justify-content:space-between; padding:0 16px 16px; }
  .price{ font-weight:600; color:var(--accent-2); }

  /* ---------- Forms ---------- */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface-alt); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; border-radius:var(--radius-sm); font-family:inherit; font-size:14px; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .auth-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:32px; margin:40px auto 0;
  }
  .auth-switch{ text-align:center; font-size:13px; color:var(--text-muted); margin-top:16px; }
  .auth-switch a{ color:var(--accent); font-weight:500; }

  /* ---------- Badge ---------- */
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; }
  .badge-success{ background:rgba(55,226,196,0.14); color:var(--accent-3); }
  .badge-warning{ background:rgba(255,176,32,0.14); color:var(--accent-2); }
  .badge-danger{ background:rgba(255,92,92,0.14); color:var(--danger); }
  .badge-muted{ background:var(--surface-alt); color:var(--text-muted); }

  /* ---------- Table ---------- */
  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; padding:12px 16px; color:var(--text-muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border); }
  td{ padding:13px 16px; border-bottom:1px solid var(--border); }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:var(--surface-alt); }

  /* ---------- Stat cards ---------- */
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
  .stat-card .label{ color:var(--text-muted); font-size:12.5px; margin-bottom:8px; }
  .stat-card .value{ font-size:26px; font-weight:700; }
  .stat-card .delta{ font-size:12px; color:var(--accent-3); margin-top:4px; }

  /* ---------- Zone selection (customer) ---------- */
  .zone-layout-wrap{
    display:grid; grid-template-columns:180px 1fr 180px; gap:16px; align-items:start;
  }
  .zone-menu-col{ display:flex; flex-direction:column; gap:10px; }
  .zone-menu-col.top-row{ grid-column:1 / -1; display:flex; flex-direction:row; flex-wrap:wrap; gap:10px; margin-bottom:4px; }
  .zone-chip{
    display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--radius-sm);
    background:var(--surface); border:1px solid var(--border); cursor:pointer; transition:.15s; text-align:left;
  }
  .zone-chip:hover{ border-color:#3a3a4a; background:var(--surface-alt); }
  .zone-chip.active{ border-color:var(--accent); background:var(--accent-dim); }
  .zone-swatch{ width:14px; height:14px; border-radius:4px; flex-shrink:0; }
  .zone-chip .zc-name{ font-size:13px; font-weight:600; }
  .zone-chip .zc-meta{ font-size:11px; color:var(--text-muted); }
  .zone-thumb{ width:40px; height:40px; border-radius:6px; object-fit:cover; flex-shrink:0; }

  .main-layout-box{
    border-radius:var(--radius); border:1px solid var(--border); overflow:hidden;
    background:var(--surface); min-height:280px; display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .main-layout-box img{ width:100%; height:100%; object-fit:contain; display:block; }
  .main-layout-placeholder{
    text-align:center; color:var(--text-muted); padding:40px 20px; font-size:13px;
    border:1px dashed var(--border); border-radius:var(--radius); background:var(--surface);
  }
  .main-layout-placeholder .ic{ font-size:34px; margin-bottom:10px; }

  /* zone tabs (shared by customer zone-selection & organizer builder) */
  .zone-layout-wrap-2{ display:grid; grid-template-columns:1fr 220px; gap:20px; align-items:start; }
  .zone-main-col{ min-width:0; }
  .zone-side-col{ position:sticky; top:90px; }
  .img-gallery{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .img-gallery.small{ grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); }
  .img-gallery img{ width:100%; height:150px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--border); display:block; }
  .img-gallery.small img{ height:80px; }
  .surrounding-col{ display:flex; flex-direction:column; gap:10px; }
  .surrounding-col.empty{ color:var(--text-muted); font-size:12px; border:1px dashed var(--border); border-radius:var(--radius-sm); padding:18px 10px; text-align:center; }
  .zone-thumb-lg{ width:100%; height:90px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--border); display:block; }
  .builder-gallery-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .img-upload-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
  .img-upload-item{ position:relative; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border); height:100px; }
  .img-upload-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .img-remove-btn{
    position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,0.65); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer;
  }
  .img-upload-add{
    display:flex; align-items:center; justify-content:center; height:100px;
    border:1.5px dashed var(--border); border-radius:var(--radius-sm);
    font-size:12px; color:var(--text-muted); cursor:pointer; text-align:center;
  }
  .img-upload-add:hover{ border-color:var(--accent); color:var(--text); }

  /* ---------- Table/seat grid (numbered, simple layout) ---------- */
  .table-grid-section{ margin-top:24px; }
  .table-grid{ display:flex; flex-wrap:wrap; gap:10px; }
  .tbl{
    width:52px; height:52px; border-radius:8px; background:var(--surface-alt);
    border:1px solid var(--border); font-size:12px; font-weight:600; display:flex;
    flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted);
    transition:.1s; flex-shrink:0;
  }
  .tbl .n{ font-size:12px; }
  .tbl .p{ font-size:9px; font-weight:400; opacity:.8; }
  .tbl.available:hover{ border-color:var(--accent); cursor:pointer; color:var(--text); }
  .tbl.booked{ background:var(--surface); color:#4a4a58; cursor:not-allowed; border-color:var(--border); }
  .tbl.selected{ background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; }
  .legend-row{ display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); margin-top:16px; }
  .legend-row span{ display:inline-flex; align-items:center; gap:6px; }
  .legend-swatch{ width:14px; height:14px; border-radius:4px; }

  .seat-summary{
    width:280px; flex-shrink:0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:20px; align-self:flex-start; position:sticky; top:90px;
  }
  .seat-summary h3{ margin:0 0 14px; font-size:15px; }
  .seat-summary-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); padding:6px 0; border-bottom:1px dashed var(--border); }
  .seat-summary-total{ display:flex; justify-content:space-between; font-size:16px; font-weight:700; margin:14px 0 18px; }
  .seatmap-wrap{ display:flex; gap:32px; flex-wrap:wrap; }

  /* ---------- Steps ---------- */
  .steps{ display:flex; align-items:center; gap:6px; margin-bottom:32px; justify-content:center; flex-wrap:wrap; }
  .step{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted); }
  .step-dot{ width:24px; height:24px; border-radius:50%; background:var(--surface-alt); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
  .step.done .step-dot{ background:var(--accent-3); color:#062621; border-color:var(--accent-3); }
  .step.current .step-dot{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .step.current{ color:var(--text); font-weight:600; }
  .step-line{ width:30px; height:1px; background:var(--border); }

  /* ---------- Ticket ---------- */
  .ticket{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    max-width:380px; margin:0 auto; overflow:hidden;
  }
  .ticket-top{ padding:22px; background:linear-gradient(135deg,#ff2e6a,#ffb020); }
  .ticket-top .eyebrow{ color:rgba(255,255,255,0.85); }
  .ticket-top h2{ margin:0; font-size:20px; color:#fff; }
  .ticket-dash{ height:0; border-top:2px dashed var(--border); position:relative; }
  .ticket-dash::before, .ticket-dash::after{
    content:""; position:absolute; top:-10px; width:20px; height:20px; border-radius:50%; background:var(--bg);
  }
  .ticket-dash::before{ left:-10px; }
  .ticket-dash::after{ right:-10px; }
  .ticket-body{ padding:22px; text-align:center; }
  .qr-box{
    width:150px; height:150px; margin:0 auto 16px; background:#fff; border-radius:8px;
    display:flex; align-items:center; justify-content:center; color:#111; font-size:11px; font-weight:600;
  }
  .qr-box svg{ width:120px; height:120px; }

  /* ---------- Empty / callout ---------- */
  .callout{
    border:1px dashed var(--border); border-radius:var(--radius); padding:30px; text-align:center; color:var(--text-muted);
  }

  /* ---------- Organizer seatmap builder ---------- */
  .builder-grid{
    display:grid; grid-template-columns:200px 1fr 200px; gap:16px; align-items:start;
  }
  .builder-upload-box{
    border:1.5px dashed var(--border); border-radius:var(--radius); background:var(--surface);
    min-height:280px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
  }
  .builder-upload-box img{ width:100%; height:100%; object-fit:contain; }
  .builder-upload-empty{ text-align:center; color:var(--text-muted); font-size:13px; padding:20px; cursor:pointer; }
  .builder-upload-empty .ic{ font-size:30px; margin-bottom:8px; }
  .file-input-hidden{ display:none; }
  .zone-edit-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px;
    margin-bottom:10px;
  }
  .zone-edit-card .ze-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .zone-edit-card input[type=color]{ width:28px; height:28px; padding:0; border:1px solid var(--border); border-radius:6px; background:none; }
  .zone-edit-card input[type=text], .zone-edit-card input[type=number]{
    background:var(--surface-alt); border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:6px 8px; font-family:inherit; font-size:12px; outline:none; width:100%;
  }
  .zone-edit-card .ze-row{ display:flex; gap:6px; margin-bottom:6px; }
  .zone-edit-card .ze-row label{ font-size:10px; color:var(--text-muted); display:block; margin-bottom:3px; }
  .zone-tab-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .builder-zones-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .zone-tab{
    padding:8px 14px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer;
    background:var(--surface-alt); border:1px solid var(--border); color:var(--text-muted);
    display:flex; align-items:center; gap:6px;
  }
  .zone-tab.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

  /* ---------- Seat-map designer (organizer zone layout builder) ---------- */
  .designer-toolbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:18px;
  }
  .designer-toolbar .dt-info{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--text-muted); }
  .designer-toolbar .dt-info strong{ color:var(--text); }
  .designer-stage{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:28px; overflow:auto; display:flex; justify-content:center;
  }
  .seat-designer-grid{ display:inline-grid; gap:6px; user-select:none; -webkit-user-select:none; }
  .designer-cell{
    width:34px; height:34px; border-radius:7px; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:700; cursor:pointer; transition:.08s; color:#fff;
    border:1px solid transparent;
  }
  .designer-cell.active{ box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15); }
  .designer-cell.inactive{
    background:transparent; border:1.5px dashed var(--border); color:var(--text-muted);
  }
  .designer-cell.inactive:hover{ border-color:var(--danger); }
  .designer-cell.active:hover{ filter:brightness(1.15); }
  .designer-legend{ display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); margin-top:16px; }
  .designer-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .designer-swatch{ width:14px; height:14px; border-radius:4px; }
  .designer-swatch.open-sw{ border:1.5px dashed var(--border); }
  .zone-grid-setup{
    max-width:380px; margin:40px auto; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:28px; text-align:center;
  }
  .zone-preview-mini{ display:inline-grid; gap:2px; }
  .zone-preview-mini .pm-cell{ width:8px; height:8px; border-radius:2px; }
  .zone-preview-mini .pm-cell.off{ background:var(--surface-alt); }
  .zone-count-pill{

/* zones[0] is always the special "overview" zone — it is NOT sellable,
   it just holds general venue photos. Every sellable zone is designed
   with a rows x cols grid ("grid") and a flat list of cells ("seats"),
   each either active (a sellable table) or inactive (carved out, so the
   grid can be shaped like a circle, triangle, etc). */
function makeOverviewZone(){ return { id:'overview', name:'ภาพรวม', color:'#9494a6', isOverview:true, images:[], surrounding:[] }; }

/* Build a rectangular grid where the first `activeCount` cells (in row-major
   order) are active tables and the rest are carved out — gives each demo
   zone a plausible starting shape without every cell being a perfect square. */
function autoGenerateGrid(zone, activeCount){
  const cols = Math.max(1, Math.ceil(Math.sqrt(activeCount * 1.6)));
  const rows = Math.max(1, Math.ceil(activeCount / cols));
  zone.grid = { rows, cols };
  zone.seats = [];
  let idx = 0;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      zone.seats.push({ row:r, col:c, active: idx < activeCount });
      idx++;
    }
  }
  ensureTableNumbers(zone);
}

/* Renumbers every active cell in row-major order (1..N) and syncs tableCount. */
function ensureTableNumbers(zone){
  if(!zone.seats){ zone.tableCount = zone.tableCount || 0; return; }
  let n = 0;
  zone.seats.forEach(s=>{
    if(s.active){ n++; s.tableNo = n; }
    else { s.tableNo = null; }
  });
  zone.tableCount = n;
}

/* ---------- Shared seat-grid renderer ----------
   Used by: the organizer's seat-map designer (interactive:true, with
   drag-paint to open/close cells), the customer zone-preview (read-only),
   and the customer table-picker (interactive:true, but clicking selects
   a table for purchase instead of opening/closing it). */
function renderSeatGrid(zone, opts){
  opts = opts || {};
  const cellSize = opts.cellSize || 34;
  const cols = zone.grid.cols;
  const rows = zone.grid.rows;
  const cells = zone.seats.map((s, idx)=>{
    if(opts.mode === 'pick'){
      // Customer table-picker: only render active cells, show booked/selected state
      if(!s.active) return `<div style="width:${cellSize}px;height:${cellSize}px;"></div>`;
      const booked = opts.isBooked ? opts.isBooked(s.tableNo) : false;
      const selected = opts.selected ? opts.selected.includes(s.tableNo) : false;
      let bg = zone.color, extra = '';
      if(booked){ bg = '#2a2a38'; extra='cursor:not-allowed;color:#4a4a58;'; }
      else if(selected){ bg = 'var(--accent)'; }
      const click = booked ? '' : `onclick="event.stopPropagation(); toggleSeat(${s.tableNo})"`;
      return `<div class="designer-cell active" style="width:${cellSize}px;height:${cellSize}px;background:${bg};${extra}" ${click} title="โต๊ะ ${s.tableNo}">${selected?'✓':s.tableNo}</div>`;
    }
    if(opts.interactive){
      // Organizer designer: every cell in the rectangle is shown, active or not
      const cls = s.active ? 'active' : 'inactive';
      const style = s.active ? `width:${cellSize}px;height:${cellSize}px;background:${zone.color};` : `width:${cellSize}px;height:${cellSize}px;`;
      return `<div class="designer-cell ${cls}" style="${style}"
        onmousedown="seatCellDown(event, '${zone.__concertId}','${zone.id}',${idx})"
        onmouseenter="seatCellEnter(event, '${zone.__concertId}','${zone.id}',${idx})"
        title="แถว ${s.row+1} คอลัมน์ ${s.col+1}">${s.active ? (s.tableNo||'') : '✕'}</div>`;
    }
    // Read-only preview (customer zone-selection tab)
    if(!s.active) return `<div style="width:${cellSize}px;height:${cellSize}px;"></div>`;
    return `<div class="designer-cell active" style="width:${cellSize}px;height:${cellSize}px;background:${zone.color};">${s.tableNo}</div>`;
  }).join('');
  return `<div class="seat-designer-grid" style="grid-template-columns:repeat(${cols},${cellSize}px);grid-template-rows:repeat(${rows},${cellSize}px);">${cells}</div>`;
}

  const i = state.selectedSeats.indexOf(n);
  if(i>-1) state.selectedSeats.splice(i,1); else state.selectedSeats.push(n);
  render();
}

function statusBadge(status){
  const map = {
    'on-sale': ['badge-success','เปิดขาย'],
    'sold-out': ['badge-warning','ขายหมด'],
    'draft': ['badge-muted','แบบร่าง'],
    'ok': ['badge-success','ปกติ'],
    'flagged': ['badge-danger','ผิดปกติ'],
    'active': ['badge-success','ใช้งานอยู่'],
    'banned': ['badge-danger','ถูกระงับ'],
    'paid': ['badge-success','ชำระเงินแล้ว'],
    'pending': ['badge-warning','รอชำระเงิน'],
    'cancelled': ['badge-muted','ยกเลิกแล้ว'],
    'refunded': ['badge-muted','คืนเงินแล้ว'],
    'used': ['badge-muted','ใช้งานแล้ว'],
  };
  const [cls,label] = map[status] || ['badge-muted', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function handleOverviewImageUpload(evt, concertId){
  const files = Array.from(evt.target.files || []);
  if(!files.length) return;
  let remaining = files.length;
  const zone = findZone(findConcert(concertId), 'overview');
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = () => {
      zone.images.push(reader.result);
      remaining--;
      if(remaining === 0){ render(); showToast('อัปโหลดรูปแล้ว (Demo)'); }
    };
    reader.readAsDataURL(file);
  });
}
function removeZoneImage(concertId, zoneId, idx){
  findZone(findConcert(concertId), zoneId).images.splice(idx,1);
  render();
}
function updateZoneField(concertId, zoneId, field, value){
  const z = findZone(findConcert(concertId), zoneId);
  if(field === 'price') value = Math.max(0, parseInt(value) || 0);
  z[field] = value;
  render();
}
function addZone(concertId){
  const c = findConcert(concertId);
  const idx = c.zones.length; // overview counts, keeps names distinct
  const palette = ['#ff2e6a','#ffb020','#37e2c4','#1c7ed6','#7c3aed'];
  const newZone = { id:'zone'+Date.now(), name:'โซนใหม่ '+idx, color:palette[idx % palette.length], price:1000, grid:null, seats:[] };
  c.zones.push(newZone);
  render();
}
function removeZone(concertId, zoneId){
  const c = findConcert(concertId);
  if(zoneId === 'overview'){ showToast('ลบโซนภาพรวมไม่ได้'); return; }
  c.zones = c.zones.filter(z=>z.id!==zoneId);
  render();
}

function createZoneGrid(concertId, zoneId){
  const rows = Math.max(1, Math.min(30, parseInt(document.getElementById('grid-rows').value) || 6));
  const cols = Math.max(1, Math.min(30, parseInt(document.getElementById('grid-cols').value) || 8));
  const zone = findZone(findConcert(concertId), zoneId);
  zone.grid = { rows, cols };
  zone.seats = [];
  for(let r=0;r<rows;r++) for(let cc=0;cc<cols;cc++) zone.seats.push({ row:r, col:cc, active:true });
  ensureTableNumbers(zone);
  render();
  showToast('สร้างผังแล้ว — ปิดช่องที่ไม่ใช่โต๊ะเพื่อปั้นรูปทรง');
}
function resetZoneGrid(concertId, zoneId){
  const zone = findZone(findConcert(concertId), zoneId);
  zone.seats.forEach(s=> s.active = true);
  ensureTableNumbers(zone);
  render();
}
function resizeZoneGrid(concertId, zoneId){
  if(!confirm('เปลี่ยนขนาดผังจะล้างการปิดช่องที่ทำไว้ทั้งหมด ต้องการดำเนินการต่อหรือไม่?')) return;
  const zone = findZone(findConcert(concertId), zoneId);
  zone.grid = null;
  zone.seats = [];
  render();
}

/* Drag-paint: mousedown decides the target state (opposite of the clicked
   cell) and applies it immediately; mouseenter on other cells while the
   mouse button is held paints the same state across everything dragged
   over, so a single drag can open or close a whole row/shape at once. */
function seatCellDown(evt, concertId, zoneId, idx){
  evt.preventDefault();
  const zone = findZone(findConcert(concertId), zoneId);
  const seat = zone.seats[idx];
  state.paint.active = true;
  state.paint.target = !seat.active;
  seat.active = state.paint.target;
  ensureTableNumbers(zone);
  render();
}
function seatCellEnter(evt, concertId, zoneId, idx){
  if(!state.paint.active) return;
  const zone = findZone(findConcert(concertId), zoneId);
  const seat = zone.seats[idx];
  if(seat.active === state.paint.target) return;
  seat.active = state.paint.target;
  ensureTableNumbers(zone);
  render();
}
window.addEventListener('mouseup', ()=>{ state.paint.active = false; });

          <div class="detail-row"><span>รหัสการจอง</span><strong>${b.id}</strong></div>
          <div class="detail-row"><span>คอนเสิร์ต</span><strong>${b.concert}</strong></div>
          <div class="detail-row"><span>โซน</span><strong>${b.zone}</strong></div>
          <div class="detail-row"><span>ที่นั่ง</span><strong>${b.seats.join(', ')}</strong></div>
          <div class="detail-row"><span>วันเวลาที่ทำรายการ</span><strong>${b.date}</strong></div>
          <div class="detail-row"><span>สถานะ</span><strong>${statusBadge(b.status)}</strong></div>
        </div>

        <div class="detail-card">
          <h3>ผู้จอง</h3>
          <div class="detail-row"><span>Username</span><strong>${b.user}</strong></div>
          <div class="detail-row"><span>อีเมล</span><strong>${b.email}</strong></div>
          <div class="detail-row"><span>IP Address</span><strong>${b.ipAddress}</strong></div>
          <div class="detail-row"><span>อุปกรณ์</span><strong>${b.device}</strong></div>
        </div>

        <div class="detail-card">
          <h3>การชำระเงิน</h3>
          <div class="detail-row"><span>ช่องทาง</span><strong>${b.paymentMethod}</strong></div>
          <div class="detail-row"><span>จำนวนเงิน</span><strong>${b.amount}</strong></div>
        </div>

        <div class="detail-card">
          <h3>ไทม์ไลน์กิจกรรม</h3>
          <ul class="timeline">
            ${b.timeline.map(t=>`<li><span class="tl-time">${t[0]}</span><span><strong style="color:var(--text);">${t[1]}</strong> — ${t[2]}</span></li>`).join('')}
          </ul>
        </div>
      </div>

      <div>
        <div class="detail-card">
          <h3>ผลการตรวจสอบ</h3>
          ${flagged
            ? `<div class="risk-box flagged">
                 <strong style="display:block; margin-bottom:6px;">⚠ ตรวจพบความผิดปกติ</strong>
                 ${b.riskFlags.map(r=>`• ${r}<br>`).join('')}
               </div>`
            : `<div class="risk-box ok"><strong>✓ ไม่พบความผิดปกติ</strong><br>รูปแบบการจองและการชำระเงินเป็นไปตามปกติ</div>`}
          <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
            ${flagged
              ? `<button class="btn btn-secondary btn-block" onclick="resolveBooking('${b.id}','ok')">ทำเครื่องหมายว่าปกติ</button>
                 <button class="btn btn-danger btn-block" onclick="showToast('ระงับการจองนี้แล้ว (Demo)')">ระงับการจองนี้</button>`
              : `<button class="btn btn-danger btn-block" onclick="resolveBooking('${b.id}','flagged')">ทำเครื่องหมายว่าผิดปกติ</button>`}
            <button class="btn btn-secondary btn-block" onclick="showToast('เปิดคำขอคืนเงินแล้ว (Demo)')">ดำเนินการคืนเงิน</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
function resolveBooking(id, newStatus){
  const b = findBooking(id);
  b.status = newStatus;
  render();
  showToast(newStatus === 'ok' ? 'ทำเครื่องหมายว่าปกติแล้ว (Demo)' : 'ทำเครื่องหมายว่าผิดปกติแล้ว (Demo)');
}

  <div class="page">

        <tr><th>เวลา</th><th>ผู้ใช้/ระบบ</th><th>เหตุการณ์</th></tr>
        ${logs.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td></tr>`).join('')}

/* ============================================================
   RENDER / ROUTE TABLE
============================================================ */
const STOREFRONT_ROUTES = {
  'home': pageHome, 'concerts': pageConcerts, 'concert-detail': pageConcertDetail,
  'zone-selection': pageZoneSelection, 'seat-selection': pageSeatSelection,
  'login': pageLogin, 'register': pageRegister,
  'my-tickets': pageMyTickets, 'booking-history': pageBookingHistory, 'ticket-detail': pageTicketDetail, 'profile': pageProfile,
  'checkout': pageCheckout, 'payment': pagePayment, 'success': pageSuccess,
};
const BACKOFFICE_ROUTES = {
  'organizer-dashboard': pageOrganizerDashboard, 'organizer-concerts': pageOrganizerConcerts,
  'organizer-concert-create': pageOrganizerConcertCreate, 'organizer-concert-edit': pageOrganizerConcertEdit,
  'organizer-zone-manage': pageOrganizerZoneManage, 'organizer-zone-seatmap': pageOrganizerZoneSeatmap,
  'organizer-reports': pageOrganizerReports, 'organizer-scan': pageOrganizerScan,
  'admin-dashboard': pageAdminDashboard, 'admin-users': pageAdminUsers,
  'admin-bookings': pageAdminBookings, 'admin-booking-detail': pageAdminBookingDetail, 'admin-logs': pageAdminLogs,
};

function render(){
  const app = document.getElementById('app');
  const isBackoffice = state.role === 'organizer' || state.role === 'admin';

  if(isBackoffice){
    const pageFn = BACKOFFICE_ROUTES[state.route] || pageOrganizerDashboard;
    app.innerHTML = `
      <div class="backoffice-shell">
        ${sidebar()}
        <div class="backoffice-main">${pageFn()}</div>
      </div>`;
  } else {
    const pageFn = STOREFRONT_ROUTES[state.route] || pageHome;
    app.innerHTML = `
      <div class="storefront-shell">
        ${storefrontTopbar()}
        <div style="flex:1;">${pageFn()}</div>
        <footer>TIXORA Prototype — Concert Ticketing System · Software Engineering, Burapha University · Team 3</footer>
      </div>`;
  }
}

render();
</script>
