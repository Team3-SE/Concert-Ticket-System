# ====================================================================
# SonarQube Cloud Configuration (SonarCloud)
# Project: Concert Ticket System
# ====================================================================

sonar.organization=team3-se
sonar.projectKey=Team3-SE_Concert-Ticket-System
sonar.projectName=Concert-Ticket-System
sonar.projectVersion=1.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Source Code Paths
sonar.sources=app,routes,resources,config,public,bootstrap

# Code Exclusions from Quality Analysis
# Exclude vendor dependencies, generated assets, binary documents, database files, and framework caches
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,database/migrations/**,**/*.docx,**/*.vpp,**/*.jsonl,**/*.sqlite,**/*.pyc

# Duplication Exclusions
sonar.cpd.exclusions=database/migrations/**,**/*.blade.php

# Rule Exclusions
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile
