# ====================================================================
# SonarQube Cloud Configuration (SonarCloud)
# Project: Concert Ticket System / PayMock
# ====================================================================

sonar.organization=team3-se
sonar.projectKey=Team3-SE_Concert-Ticket-System
sonar.projectName=Concert-Ticket-System
sonar.projectVersion=1.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Source Code Paths
sonar.sources=paymock/app,paymock/routes,paymock/resources,paymock/config,paymock/public

# Test Paths
sonar.tests=paymock/tests
sonar.test.inclusions=paymock/tests/**/*Test.php

# Code Exclusions from Quality Analysis
# Exclude vendor dependencies, generated assets, binary documents, database files, and framework caches
sonar.exclusions=paymock/vendor/**,paymock/public/build/**,paymock/storage/**,paymock/database/migrations/**,**/*.docx,**/*.vpp,**/*.jsonl,**/*.sqlite,**/*.pyc,paymock/tests-k6/**

# Duplication Exclusions
sonar.cpd.exclusions=paymock/database/migrations/**,paymock/tests/**,**/*.blade.php

# Rule Exclusions
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile

# PHP Specific Settings
sonar.php.coverage.reportPaths=paymock/coverage.xml
sonar.php.tests.reportPath=paymock/test-report.xml
