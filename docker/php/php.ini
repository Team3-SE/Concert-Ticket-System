; Custom PHP configuration for Concert Ticket System

[PHP]
; Maximum upload file size
upload_max_filesize = 20M
post_max_size       = 20M

; Max execution time (seconds)
max_execution_time  = 60
max_input_time      = 60

; Memory limit
memory_limit        = 256M

; Error reporting (development)
display_errors      = On
log_errors          = On
error_log           = /var/www/html/storage/logs/php_errors.log

; Timezone
date.timezone       = Asia/Bangkok

; จำตำแหน่งไฟล์ที่ include ไว้ (ลดการค้นไฟล์ซ้ำ ๆ ซึ่งช้ามากเมื่อโปรเจกต์อยู่บนไดรฟ์ Windows)
realpath_cache_size = 4096K
realpath_cache_ttl  = 600

[opcache]
opcache.enable           = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files   = 10000
; ตรวจว่าไฟล์ PHP ถูกแก้หรือยังทุก 2 วินาที (เดิม 0 = ตรวจทุกไฟล์ทุก request ทำให้ช้า)
; แก้โค้ดแล้วจะเห็นผลภายใน 2 วินาที
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 2
opcache.fast_shutdown           = 1
