<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal - เพิ่มบริษัทใหม่</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-navy: #0B2F61;
            --secondary-blue: #2563EB;
            --accent-orange: #F27A18;
            --bg-light: #F8FAFC;
            --card-white: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-yellow: #F59E0B;
            --radius-md: 8px;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Modal (Add Company) --- */
        .modal-overlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-box {
            background: var(--card-white);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-navy);
            margin-bottom: 16px;
        }

        .modal-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin-bottom: 6px;
        }

        .modal-input:focus {
            border-color: var(--secondary-blue);
        }

        .modal-error {
            font-size: 12px;
            color: var(--error-red);
            min-height: 16px;
            margin-bottom: 10px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-modal-cancel {
            background-color: #F1F5F9;
            color: #475569;
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-modal-cancel:hover { background-color: #E2E8F0; }

        .btn-modal-confirm {
            background-color: var(--secondary-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-modal-confirm:hover { background-color: #1D4ED8; }
    </style>
</head>
<body>

    <!-- Add Company Modal -->
    <div class="modal-overlay" id="addModalOverlay">
        <div class="modal-box">
            <div class="modal-title">เพิ่มบริษัทใหม่</div>
            <label class="modal-label" for="newCompanyName">ชื่อบริษัท</label>
            <input type="text" id="newCompanyName" class="modal-input" placeholder="เช่น GMM Show Co., Ltd." maxlength="150">
            <div class="modal-error" id="addCompanyError"></div>
            <div class="modal-actions">
                <button class="btn-modal-cancel">ยกเลิก</button>
                <button class="btn-modal-confirm">บันทึก</button>
            </div>
        </div>
    </div>

</body>
</html>
