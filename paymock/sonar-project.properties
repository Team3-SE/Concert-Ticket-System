# ====================================================================
# SonarQube Cloud Configuration (PayMock Subproject)
# ====================================================================

sonar.organization=team3-se
sonar.projectKey=Team3-SE_Concert-Ticket-System_PayMock
sonar.projectName=PayMock
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

sonar.sources=app,routes,resources,config,public
sonar.tests=tests
sonar.test.inclusions=tests/**/*Test.php

sonar.exclusions=vendor/**,public/build/**,storage/**,database/migrations/**,**/*.sqlite
sonar.cpd.exclusions=database/migrations/**,tests/**,**/*.blade.php

sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-report.xml
