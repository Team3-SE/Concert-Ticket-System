<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TEAM 3 Ticket — ระบบจัดการข้อผิดพลาด</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --navy:#0B2F61;
    --navy-deep:#081F42;
    --navy-light:#234370;
    --accent:#F47B20;
    --accent-dark:#DB6812;
    --primary:#0B2F61;
    --primary-dark:#081F42;
    --bg:#EEF2F6;
    --border:#E5E7EB;
    --text:#0F172A;
    --muted:#64748B;
    --muted-light:#94A3B8;
    --sidebar-w:236px;
    --topbar-h:52px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);font-family:'Inter','Noto Sans Thai',ui-sans-serif,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  button,select,input,textarea{font-family:inherit;}
  button{cursor:pointer;background:none;border:none;}
  svg.ic{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0;}

  /* ---------------- app shell ---------------- */
  .app-shell{display:flex;min-height:100vh;}

  /* sidebar */
  .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 18px;}
  .brand-icon{height:32px;width:32px;border-radius:9px;background:linear-gradient(160deg,var(--accent),#C2530A);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-icon svg{color:#fff;}
  .brand-text{color:#fff;font-size:14.5px;font-weight:700;letter-spacing:.01em;}
  .brand-text span{color:var(--accent);}

  .nav{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;height:42px;padding:0 12px 0 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:#9FB0C9;border-left:3px solid transparent;transition:all .12s;text-align:left;width:100%;}
  .nav-item svg{flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:#E2E8F0;}
  .nav-item.active{background:var(--navy-light);color:#fff;border-left-color:var(--accent);font-weight:600;}
  .nav-item.active svg{opacity:1;color:var(--accent);}

  .nav-footer{padding:12px;border-top:1px solid rgba(255,255,255,.08);}
  .nav-logout{display:flex;align-items:center;gap:11px;height:42px;padding:0 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:#F87171;width:100%;transition:background .12s;}
  .nav-logout:hover{background:rgba(248,113,113,.1);}

  /* main column */
  .main-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;}
  .topbar{height:var(--topbar-h);flex-shrink:0;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
  .breadcrumb{font-size:12.5px;color:#B9C6DA;}
  .breadcrumb b{color:#fff;font-weight:600;}
  .admin-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:999px;padding:5px 14px 5px 5px;}
  .admin-avatar{height:24px;width:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:10.5px;font-weight:700;}
  .admin-pill span{color:#fff;font-size:12.5px;font-weight:500;}

  .content-scroll{flex:1;overflow-y:auto;}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 32px 60px;}

  .page-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .page-title{font-size:23px;font-weight:800;letter-spacing:-0.01em;color:var(--navy);}
  .page-sub{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .page-owner{font-size:12.5px;color:var(--muted);white-space:nowrap;margin-top:4px;}
  .page-owner b{color:var(--navy);font-weight:600;}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:24px 0 22px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-top:3px solid var(--navy);border-radius:12px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .stat-label{font-size:12.5px;font-weight:500;color:var(--muted);}
  .stat-value{font-size:23px;font-weight:700;margin-top:6px;color:var(--navy);}
  .stat-icon{height:42px;width:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;}

  /* filter card */
  .filter-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:22px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .filter-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .search-box{position:relative;flex:1;min-width:260px;}
  .search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-light);}
  .search-box input{width:100%;height:40px;padding:0 14px 0 38px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;color:var(--text);outline:none;transition:border-color .15s;}
  .search-box input:focus{border-color:var(--navy);}
  .search-box input::placeholder{color:var(--muted-light);}
  .select-field{position:relative;}
  .select-field svg.pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-light);pointer-events:none;}
  .select-field svg.post{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted-light);pointer-events:none;}
  .select-field select{height:40px;padding:0 30px 0 36px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:#475569;background:#fff;outline:none;appearance:none;cursor:pointer;}
  .select-field select:focus{border-color:var(--navy);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .chip{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--border);background:#fff;color:#475569;transition:all .15s;}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* table */
  .table-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:1150px;}
  thead tr{background:var(--navy);border-bottom:1px solid var(--border);}
  th{font-size:11px;font-weight:700;letter-spacing:.03em;color:#CBD9EC;padding:12px 16px;text-align:left;}
  th.right,td.right{text-align:right;}
  tbody tr{border-bottom:1px solid var(--border);transition:background .12s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#F5F8FC;}
  td{padding:14px 16px;font-size:13.5px;vertical-align:top;}
  .cust-name{font-weight:500;color:#1e293b;}
  .cust-email{font-size:12px;color:var(--muted-light);margin-top:1px;}
  .desc-cell{font-size:13px;color:var(--muted);max-width:260px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .bk-id{font-weight:700;color:var(--navy);}
  .time-cell{font-size:13px;color:var(--muted);white-space:nowrap;}
  .row-actions{display:flex;justify-content:flex-end;gap:6px;}
  .icon-btn{height:32px;width:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--border);transition:all .12s;}
  .icon-btn:hover{color:var(--navy);background:#EEF2F6;border-color:#C9D6E8;}
  .empty-row td{padding:60px 0;text-align:center;color:var(--muted-light);font-size:13.5px;}
  .footnote{font-size:12.5px;color:var(--muted-light);margin-top:16px;}

  /* badges/tags */
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid transparent;padding:4px 10px;font-size:12px;font-weight:500;white-space:nowrap;}
  .badge .dot{height:6px;width:6px;border-radius:50%;flex-shrink:0;}
  .badge.pending{background:#FFF4E9;color:#B45309;border-color:#FBD9AF;}
  .badge.pending .dot{background:var(--accent);}
  .badge.investigating{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE;}
  .badge.investigating .dot{background:#3B82F6;}
  .badge.fixed{background:#ECFDF5;color:#047857;border-color:#A7F3D0;}
  .badge.fixed .dot{background:#10B981;}
  .badge.critical{background:#FEF2F2;color:#B91C1C;border-color:#FECACA;}
  .badge.critical .dot{background:#EF4444;}

  .tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;white-space:nowrap;}
  .tag.Booking{background:#EEF2FF;color:#4338CA;}
  .tag.Payment{background:#EFF6FF;color:#1D4ED8;}
  .tag.Seat{background:#FFF4E9;color:var(--accent-dark);}
  .tag.Order{background:#F0FDFA;color:#0F766E;}
  .tag.Customer{background:#F1F5F9;color:#475569;}

  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(8,31,66,.45);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:520px;max-width:100%;background:#fff;z-index:50;box-shadow:-8px 0 30px rgba(15,23,42,.15);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
  .drawer.show{transform:translateX(0);}
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);background:var(--navy);}
  .drawer-title{display:flex;align-items:center;gap:8px;}
  .drawer-title h3{font-size:16px;font-weight:700;color:#fff;}
  .drawer-sub{font-size:13px;color:#B9C6DA;margin-top:4px;}
  .drawer-close{height:32px;width:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#B9C6DA;transition:all .12s;}
  .drawer-close:hover{background:rgba(255,255,255,.1);color:#fff;}
  .drawer-body{flex:1;overflow-y:auto;padding-bottom:40px;}
  .d-section{border-top:1px solid var(--border);}
  .d-section-title{padding:20px 24px 6px;font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--navy);}
  .d-section-body{padding:0 24px 16px;}
  .field-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid #F1F5F9;}
  .field-row:first-child{border-top:none;}
  .field-label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .field-label svg{color:var(--muted-light);}
  .field-value{font-size:13px;font-weight:500;color:#1e293b;text-align:right;}
  .syslog{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted);line-height:1.9;padding:4px 0;background:#F8FAFC;border-radius:8px;}
  .syslog p{display:flex;align-items:flex-start;gap:6px;padding:2px 10px;}
  .syslog svg{margin-top:2px;color:var(--muted-light);flex-shrink:0;}

  .actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 24px 24px;}
  .action-btn{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--border);font-size:12.5px;font-weight:500;color:#334155;text-align:left;transition:all .12s;}
  .action-btn:hover{background:#EEF2F6;border-color:#C9D6E8;}
  .action-btn svg{color:var(--navy);flex-shrink:0;}
  .action-btn.danger{border-color:#FECACA;color:#DC2626;}
  .action-btn.danger svg{color:#EF4444;}
  .action-btn.danger:hover{background:#FEF2F2;}

  .timeline{padding:0 24px 24px;}
  .t-item{display:flex;gap:12px;}
  .t-left{display:flex;flex-direction:column;align-items:center;}
  .t-avatar{height:32px;width:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .t-line{width:1px;flex:1;background:#E2E8F0;margin:4px 0;}
  .t-body{flex:1;padding-bottom:20px;}
  .t-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .t-action{font-size:13px;font-weight:600;color:#1e293b;}
  .t-time{font-size:11.5px;color:var(--muted-light);white-space:nowrap;}
  .t-by{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .t-by b{color:#475569;font-weight:600;}
  .t-transition{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;}
  .t-before{padding:2px 8px;border-radius:6px;background:#F1F5F9;color:var(--muted);}
  .t-after{padding:2px 8px;border-radius:6px;background:#FFF4E9;color:var(--accent-dark);font-weight:600;}
  .t-arrow{color:var(--muted-light);}
  .t-reason{font-size:12.5px;color:var(--muted);margin-top:6px;font-style:italic;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(8,31,66,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:420px;padding:24px;box-shadow:0 20px 40px rgba(15,23,42,.25);}
  .modal-head{display:flex;align-items:center;gap:12px;}
  .modal-icon{height:40px;width:40px;border-radius:12px;background:#EEF2F6;color:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .modal-icon.danger{background:#FEF2F2;color:#DC2626;}
  .modal-head h3{font-size:15.5px;font-weight:700;color:var(--navy);}
  .modal-desc{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.6;}
  .modal-desc b{color:#334155;font-weight:600;}
  .modal-label{font-size:12.5px;font-weight:500;color:#475569;margin-top:16px;margin-bottom:6px;display:block;}
  .modal textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:#334155;resize:none;outline:none;}
  .modal textarea:focus{border-color:var(--navy);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .btn-secondary{height:40px;padding:0 16px;border-radius:8px;font-size:13.5px;font-weight:500;color:#475569;border:1px solid var(--border);transition:background .12s;}
  .btn-secondary:hover{background:#F8FAFC;}
  .btn-primary{height:40px;padding:0 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:#fff;background:var(--navy);transition:background .12s;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-primary.danger{background:#DC2626;}
  .btn-primary.danger:hover{background:#B91C1C;}

  /* toast */
  .toast{position:fixed;bottom:24px;right:24px;z-index:70;display:flex;align-items:center;gap:10px;background:var(--navy-deep);color:#fff;font-size:13px;font-weight:500;border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px rgba(15,23,42,.35);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .25s;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast svg{color:var(--accent);}

  @media (max-width:1100px){
    .stats{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6"/><path d="M22 9a3 3 0 0 0 0 6"/><rect x="2" y="5" width="20" height="14" rx="2"/></svg>
      </div>
      <div class="brand-text">TEAM <span>3</span> Ticket</div>
    </div>
    <nav class="nav">
      <button class="nav-item">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        จัดการผู้ใช้
      </button>
      <button class="nav-item">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        รายงานความผิดปกติ
      </button>
      <button class="nav-item active">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg>
        จัดการข้อผิดพลาดระบบ
      </button>
      <button class="nav-item">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 15 15"/></svg>
        ประวัติการแก้ไข
      </button>
    </nav>
    <div class="nav-footer">
      <button class="nav-logout">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        ออกจากระบบ
      </button>
    </div>
  </aside>

  <!-- Main column -->
  <div class="main-col">
    <div class="topbar">
      <p class="breadcrumb">ระบบดูแลผู้ดูแลระบบ &nbsp;›&nbsp; <b>จัดการข้อผิดพลาดระบบ</b></p>
      <div class="admin-pill">
        <div class="admin-avatar">AD</div>
        <span>Admin</span>
      </div>
    </div>

    <div class="content-scroll">
      <div class="wrap">
        <div class="page-head-row">
          <div>
            <h1 class="page-title">ระบบจัดการข้อผิดพลาด (System Error Management)</h1>
            <p class="page-sub">แก้ไขข้อผิดพลาดด้านการจอง การชำระเงิน ที่นั่ง และความไม่สอดคล้องของระบบ</p>
          </div>
          <p class="page-owner">ผู้ดูแลระบบ: <b>Admin</b></p>
        </div>

        <div class="stats" id="stats"></div>

        <div class="filter-card">
          <div class="filter-row">
            <div class="search-box">
              <svg class="ic" width="16" height="16" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input id="searchInput" type="text" placeholder="ค้นหาด้วยรหัสการจอง ชื่อลูกค้า หรืออีเวนต์" />
            </div>
            <div class="select-field">
              <svg class="ic pre" width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <select id="statusFilter">
                <option value="All statuses">สถานะทั้งหมด</option>
                <option value="Pending">รอดำเนินการ</option>
                <option value="Investigating">กำลังตรวจสอบ</option>
                <option value="Fixed">แก้ไขแล้ว</option>
                <option value="Critical">วิกฤต</option>
              </select>
              <svg class="ic post" width="14" height="14" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="select-field">
              <svg class="ic pre" width="15" height="15" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <select id="dateRange">
                <option value="All time">ทุกช่วงเวลา</option>
                <option value="Last hour">ชั่วโมงล่าสุด</option>
                <option value="Today">วันนี้</option>
                <option value="Last 7 days">7 วันล่าสุด</option>
              </select>
              <svg class="ic post" width="14" height="14" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>

function minutesAgo(m){ return new Date(Date.now() - m*60000); }
function timeAgo(date){
  const mins = Math.floor((Date.now()-date.getTime())/60000);
  if(mins<1) return "เมื่อสักครู่";
  if(mins<60) return mins+" นาทีที่แล้ว";
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+" ชั่วโมงที่แล้ว";
  const days = Math.floor(hrs/24);
  return days+" วันที่แล้ว";
}
function fmtDateTime(date){
  return date.toLocaleString('th-TH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
function initials(name){
  if(name==="System") return "SY";
  return name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
}

/* ---------------------------- render: chips ---------------------------- */
function renderChips(){
  document.getElementById('chips').innerHTML = CATEGORIES.map(c=>`
    <button class="chip ${state.category===c?'active':''}" onclick="setCategory('${c}')">${CATEGORY_TH[c]}</button>
  `).join('');
}
function setCategory(c){ state.category=c; renderChips(); renderTable(); }

/* ---------------------------- filtering ---------------------------- */
function getFiltered(){
  return errors.filter(e=>{
    if(state.category!=="All" && e.errorType!==state.category) return false;
    if(state.statusFilter!=="All statuses" && e.status!==state.statusFilter) return false;
    if(state.dateRange!=="All time"){
      const hrs = (Date.now()-e.created.getTime())/3600000;
      if(state.dateRange==="Last hour" && hrs>1) return false;
      if(state.dateRange==="Today" && hrs>24) return false;
      if(state.dateRange==="Last 7 days" && hrs>168) return false;
    }
    if(state.search.trim()){
      const q = state.search.toLowerCase();
      const hay = `${e.bookingId} ${e.customer} ${e.event} ${e.errorType}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ---------------------------- render: table ---------------------------- */
function renderTable(){
  const filtered = getFiltered();
  const body = document.getElementById('tableBody');
  if(filtered.length===0){
    body.innerHTML = `<tr class="empty-row"><td colspan="8">ไม่พบรายการที่ตรงกับตัวกรองของคุณ</td></tr>`;
  } else {
    body.innerHTML = filtered.map(e=>{
      const sm = STATUS_META[e.status];
      const tm = TYPE_META[e.errorType];
      return `
      <tr>
        <td><span class="bk-id">${e.bookingId}</span></td>
        <td>
          <div class="cust-name">${e.customer}</div>
          <div class="cust-email">${e.email}</div>
        </td>
        <td>${e.event}</td>
        <td><span class="tag ${e.errorType}">${icon(tm.icon,13)}${TYPE_TH[e.errorType]}</span></td>
        <td><div class="desc-cell">${e.description}</div></td>
        <td><span class="badge ${sm.cls}"><span class="dot"></span>${STATUS_TH[e.status]}</span></td>
        <td><span class="time-cell">${timeAgo(e.created)}</span></td>
        <td class="right">
          <div class="row-actions">
            <button class="icon-btn" title="ดูรายละเอียด" onclick="openDrawer('${e.id}')">${icon('eye',15)}</button>
            <button class="icon-btn" title="แก้ไข" onclick="openDrawer('${e.id}','actions')">${icon('wrench',15)}</button>
            <button class="icon-btn" title="ประวัติการตรวจสอบ" onclick="openDrawer('${e.id}','timeline')">${icon('history',15)}</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }
  document.getElementById('footnote').textContent = `แสดง ${filtered.length} จากทั้งหมด ${errors.length} รายการ`;
}

      document.getElementById('anchor-actions').scrollIntoView({behavior:'smooth',block:'start'});
    } else if(focus==='timeline'){
      document.getElementById('anchor-timeline').scrollIntoView({behavior:'smooth',block:'start'});
    } else {
      body.scrollTo({top:0});
    }
  }, 150);
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  setTimeout(()=>{ state.selectedId=null; }, 250);
}

        ${field('สถานะ', `<span class="badge ${sm.cls}"><span class="dot"></span>${STATUS_TH[e.status]}</span>`)}

      <div class="d-section-title">ข้อมูลลูกค้า</div>

/* ---------------------------- confirmation modal ---------------------------- */
function requestAction(action){
  pendingAction = action;
  document.getElementById('modalReason').value = "";
  document.getElementById('modalIcon').className = 'modal-icon' + (action.danger?' danger':'');
  document.getElementById('modalIcon').innerHTML = icon(action.icon, 18);
  document.getElementById('modalTitle').textContent = action.label;
  const e = errors.find(x=>x.id===state.selectedId);
  document.getElementById('modalDesc').innerHTML = `คุณกำลังจะ <b>${action.label}</b> สำหรับการจอง <b>${e.bookingId}</b> การดำเนินการนี้จะถูกบันทึกไว้ในประวัติการตรวจสอบ`;
  const btn = document.getElementById('modalConfirmBtn');
  btn.className = 'btn-primary' + (action.danger?' danger':'');
  btn.textContent = 'ยืนยัน' + action.label;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  pendingAction = null;
}
document.getElementById('modalOverlay').addEventListener('click', function(ev){
  if(ev.target===this) closeModal();
});

function confirmAction(){
  if(!pendingAction) return;
  const e = errors.find(x=>x.id===state.selectedId);
  const reasonInput = document.getElementById('modalReason').value.trim() || 'ไม่ได้ระบุเหตุผล';
  const afterKey = pendingAction.key==='cancelBooking' ? 'Critical' : 'Fixed';
  const entry = { who:'คุณ', action:pendingAction.label, before:STATUS_TH[e.status], after:STATUS_TH[afterKey], reason:reasonInput, time:new Date() };
  e.audit.unshift(entry);
  e.status = afterKey;
  showToast(`${pendingAction.label} สำเร็จสำหรับ ${e.bookingId}`);
  closeModal();
  renderStats();
  renderTable();
  renderDrawer();
  setTimeout(()=>{ document.getElementById('anchor-timeline').scrollIntoView({behavior:'smooth',block:'start'}); }, 100);
}

/* ---------------------------- toast ---------------------------- */
let toastTimer = null;
function showToast(msg){
  document.getElementById('toastMsg').textContent = msg;
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ---------------------------- filter listeners ---------------------------- */
document.getElementById('searchInput').addEventListener('input', e=>{ state.search=e.target.value; renderTable(); });
document.getElementById('statusFilter').addEventListener('change', e=>{ state.statusFilter=e.target.value; renderTable(); });
document.getElementById('dateRange').addEventListener('change', e=>{ state.dateRange=e.target.value; renderTable(); });

/* ---------------------------- init ---------------------------- */
renderStats();
renderChips();
renderTable();
</script>
