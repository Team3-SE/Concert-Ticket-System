name: "Reusable Security Pipeline"

on:
  workflow_call:
    inputs:
      app_port:
        description: "Application listening port"
        type: number
        required: true
      app_start_command:
        description: "Shell command to start the application in background"
        type: string
        required: true
      zap_target:
        description: "Target URL for OWASP ZAP scan (e.g., http://127.0.0.1:8081)"
        type: string
        required: true
      sonar_project_key:
        description: "SonarQube Cloud project key"
        type: string
        required: true
      sonar_organization:
        description: "SonarQube Cloud organization key"
        type: string
        required: false
        default: ""
      runtime:
        description: "Runtime environment for the application ('php', 'node', 'python', 'custom')"
        type: string
        required: false
        default: "php"
      runtime_version:
        description: "Runtime version (e.g., '8.3' for PHP, '20' for Node, '3.12' for Python)"
        type: string
        required: false
        default: "8.3"
      working_directory:
        description: "Working directory relative to repository root"
        type: string
        required: false
        default: "."
      install_command:
        description: "Dependency installation command"
        type: string
        required: false
        default: ""
      pre_start_command:
        description: "Commands to run before starting the app (e.g. database migrations, key generation)"
        type: string
        required: false
        default: ""
      build_command:
        description: "Build command if applicable"
        type: string
        required: false
        default: ""
      test_command:
        description: "Test execution command"
        type: string
        required: false
        default: ""
      lint_command:
        description: "Linting command"
        type: string
        required: false
        default: ""
      health_check_url:
        description: "URL or endpoint to verify application readiness"
        type: string
        required: false
        default: ""
      startup_timeout:
        description: "Timeout in seconds to wait for application readiness"
        type: number
        required: false
        default: 60
      zap_rules_file:
        description: "Relative path to ZAP rules configuration file"
        type: string
        required: false
        default: ""
      fail_on_severity:
        description: "Failure threshold for DAST findings ('critical', 'high', 'medium', 'none')"
        type: string
        required: false
        default: "high"
      sonar_wait_quality_gate:
        description: "Whether to wait for SonarQube Cloud Quality Gate and fail on failure"
        type: boolean
        required: false
        default: true
    secrets:
      SONAR_TOKEN:
        description: "Authentication token for SonarQube Cloud"
        required: true
      APP_ENV_FILE:
        description: "Optional content to write to .env file before startup"
        required: false

permissions:
  contents: read

jobs:
  # =========================================================================
  # Job 1: SonarQube Cloud Static Application Security Testing (SAST)
  # =========================================================================
  sonar_sast:
    name: "1. SonarQube Cloud SAST"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code (Full History for PR Blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube Cloud Scanner
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        with:
          projectBaseDir: ${{ inputs.working_directory }}
          args: >
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            ${{ inputs.sonar_organization != '' && format('-Dsonar.organization={0}', inputs.sonar_organization) || '' }}
            -Dsonar.host.url=https://sonarcloud.io

      - name: SonarQube Quality Gate Check
        if: ${{ inputs.sonar_wait_quality_gate }}
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        with:
          scanMetadataReportFile: ${{ inputs.working_directory }}/.scannerwork/report-task.txt

      - name: Fetch SonarCloud Issues & Quality Gate Details
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          REPORT_FILE="${{ inputs.working_directory }}/.scannerwork/report-task.txt"
          SONAR_PROJECT="${{ inputs.sonar_project_key }}"
          SONAR_ORG="${{ inputs.sonar_organization }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          OUT_DIR="sonarqube-sast-data"
          mkdir -p "$OUT_DIR"

          # Copy report-task.txt if present
          if [ -f "$REPORT_FILE" ]; then
            cp "$REPORT_FILE" "$OUT_DIR/report-task.txt"
          fi

          # Fetch Quality Gate status
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse

          token = os.environ.get("SONAR_TOKEN", "")
          project = os.environ.get("SONAR_PROJECT", "")
          org = os.environ.get("SONAR_ORG", "")
          pr_number = os.environ.get("PR_NUMBER", "")
          branch = os.environ.get("BRANCH", "")
          out_dir = os.environ.get("OUT_DIR", "sonarqube-sast-data")
          base_url = "https://sonarcloud.io"

          def sonar_get(path, params=None):
              url = f"{base_url}{path}"
              if params:
                  url = f"{url}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url)
              if token:
                  import base64
                  creds = base64.b64encode(f"{token}:".encode()).decode()
                  req.add_header("Authorization", f"Basic {creds}")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode())
              except Exception as e:
                  print(f"  Warning: {path} failed: {e}")
                  return None

          def save(filename, data):
              with open(os.path.join(out_dir, filename), "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
              print(f"  Saved {filename}")

          print("Fetching SonarCloud Quality Gate status...")
          qg_params = {"projectKey": project}
          if pr_number:
              qg_params["pullRequest"] = pr_number
          elif branch:
              qg_params["branch"] = branch
          if org:
              qg_params["organization"] = org
          qg = sonar_get("/api/qualitygates/project_status", qg_params)
          if qg:
              save("quality-gate-status.json", qg)
              status = qg.get("projectStatus", {}).get("status", "UNKNOWN")
              print(f"  Quality Gate: {status}")

          print("Fetching SonarCloud Issues (bugs, vulnerabilities, code smells)...")
          issues_params = {
              "componentKeys": project,
              "types": "BUG,VULNERABILITY,CODE_SMELL",
              "ps": 500,
              "additionalFields": "rules,comments",
          }
          if pr_number:
              issues_params["pullRequest"] = pr_number
          elif branch:
              issues_params["branch"] = branch
          issues = sonar_get("/api/issues/search", issues_params)
          if issues:
              save("issues.json", issues)
              print(f"  Issues fetched: {issues.get('total', 0)}")

          print("Fetching SonarCloud Security Hotspots...")
          hs_params = {"projectKey": project, "ps": 500}
          if pr_number:
              hs_params["pullRequest"] = pr_number
          elif branch:
              hs_params["branch"] = branch
          hotspots = sonar_get("/api/hotspots/search", hs_params)
          if hotspots:
              save("hotspots.json", hotspots)
              print(f"  Hotspots fetched: {len(hotspots.get('hotspots', []))}")

          # Create summary JSON
          summary = {
              "project_key": project,
              "organization": org,
              "pr_number": pr_number,
              "branch": branch,
              "quality_gate": qg.get("projectStatus") if qg else None,
              "total_issues": issues.get("total", 0) if issues else 0,
              "total_hotspots": len(hotspots.get("hotspots", [])) if hotspots else 0,
          }
          save("sonarqube-summary.json", summary)
          print("Done fetching SonarCloud data.")
          PYEOF
        env:
          SONAR_PROJECT: ${{ inputs.sonar_project_key }}
          SONAR_ORG: ${{ inputs.sonar_organization }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OUT_DIR: sonarqube-sast-data

      - name: Upload Step 1 — SonarQube SAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step1-sonarqube-sast-report-run-${{ github.run_id }}
          path: |
            sonarqube-sast-data/
            ${{ inputs.working_directory }}/.scannerwork/report-task.txt
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  # Job 2: Dynamic Application Security Testing (DAST) with OWASP ZAP
  # =========================================================================
  dast_zap:
    name: "2. OWASP ZAP DAST Analysis"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        if: ${{ inputs.runtime == 'php' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.runtime_version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, zip, gd, curl
          coverage: none

      - name: Setup Node Environment
        if: ${{ inputs.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.runtime_version }}

      - name: Setup Python Environment
        if: ${{ inputs.runtime == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.runtime_version }}

      - name: Prepare Laravel Cache & Storage Directories
        if: ${{ inputs.runtime == 'php' }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs database
          chmod -R 775 bootstrap/cache storage database 2>/dev/null || true

      - name: Install Application Dependencies
        if: ${{ inputs.install_command != '' }}
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.install_command }}

      - name: Configure Application Environment & Database
        if: ${{ inputs.pre_start_command != '' }}
        working-directory: ${{ inputs.working_directory }}
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          if [ -n "$APP_ENV_FILE" ]; then
            echo "$APP_ENV_FILE" > .env
          fi
          ${{ inputs.pre_start_command }}

      - name: Start Application Locally in Background
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "Starting application locally..."
          nohup ${{ inputs.app_start_command }} > /tmp/app_server.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          echo "Application started with PID: $APP_PID"

      - name: Verify Application Health
        run: |
          HEALTH_URL="${{ inputs.health_check_url }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="http://127.0.0.1:${{ inputs.app_port }}/"
          fi
          TIMEOUT=${{ inputs.startup_timeout }}
          echo "Checking application health at $HEALTH_URL (timeout: ${TIMEOUT}s)..."
          ELAPSED=0
          READY=false
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if curl -s -f -o /dev/null -m 2 "$HEALTH_URL"; then
              echo "Application is ready and responding at $HEALTH_URL! (took ${ELAPSED}s)"
              READY=true
              break
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          if [ "$READY" = "false" ]; then
            echo "ERROR: Application failed to respond within ${TIMEOUT}s!"
            echo "=== Application Log Output (/tmp/app_server.log) ==="
            cat /tmp/app_server.log || true
            exit 1
          fi

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.zap_target }}
          network_name: host
          rules_file_name: ${{ inputs.zap_rules_file }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: ''
          cmd_options: '-a'

      - name: Evaluate DAST Findings & Enforce Policy
        if: always()
        env:
          FAIL_SEVERITY: ${{ inputs.fail_on_severity }}
          TARGET_URL: ${{ inputs.zap_target }}
        run: |
          python3 -c '
          import json, sys, os

          report_file = "report_json.json"
          fail_severity = os.environ.get("FAIL_SEVERITY", "high").strip().lower()
          target_url = os.environ.get("TARGET_URL", "")
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")

          counts = {"critical": 0, "high": 0, "medium": 0, "low": 0, "informational": 0}
          alerts_list = []

          if os.path.exists(report_file):
              try:
                  with open(report_file, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      sites = data.get("site", [])
                      if isinstance(sites, dict):
                          sites = [sites]
                      for site in sites:
                          for alert in site.get("alerts", []):
                              risk_code = str(alert.get("riskcode", "0"))
                              name = alert.get("alert", "Unknown Alert")
                              count = int(alert.get("count", 1))
                              confidence = alert.get("confidence", "")
                              conf_map = {"0": "False Positive", "1": "Low", "2": "Medium", "3": "High", "4": "Confirmed"}
                              conf_text = conf_map.get(str(confidence), str(confidence))

                              if risk_code == "3":
                                  sev = "high"
                              elif risk_code == "2":
                                  sev = "medium"
                              elif risk_code == "1":
                                  sev = "low"
                              else:
                                  sev = "informational"

                              counts[sev] += count
                              alerts_list.append((sev.upper(), name, count, conf_text))
              except Exception as e:
                  print(f"Warning parsing report: {e}")

          summary_md = []
          summary_md.append("### 🛡️ OWASP ZAP DAST Scan Findings\n\n")
          summary_md.append(f"- **Target**: `{target_url}`\n")
          summary_md.append(f"- **Enforced Failure Policy**: Fail on `{fail_severity}` or higher\n\n")
          summary_md.append("| Severity | Total Findings |\n|---|---|\n")
          summary_md.append(f"| 🔴 Critical / High | {counts[\"high\"]} |\n")
          summary_md.append(f"| 🟠 Medium | {counts[\"medium\"]} |\n")
          summary_md.append(f"| 🟡 Low | {counts[\"low\"]} |\n")
          summary_md.append(f"| ⚪ Informational | {counts[\"informational\"]} |\n\n")

          if alerts_list:
              summary_md.append("#### Alert Details\n\n")
              summary_md.append("| Severity | Alert Name | Count | Confidence |\n|---|---|---|---|\n")
              for sev, name, cnt, conf in alerts_list:
                  summary_md.append(f"| {sev} | {name} | {cnt} | {conf} |\n")
          else:
              summary_md.append("🎉 **No security alerts identified by OWASP ZAP!**\n")

          summary_str = "".join(summary_md)
          print(summary_str)

          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write(summary_str)

          failed = False
          reason = ""
          if fail_severity == "critical" and counts["critical"] > 0:
              failed = True
              reason = f"Identified {counts[\"critical\"]} Critical severity alert(s)."
          elif fail_severity == "high" and counts["high"] > 0:
              failed = True
              reason = f"Identified {counts[\"high\"]} High severity alert(s)."
          elif fail_severity == "medium" and (counts["high"] + counts["medium"]) > 0:
              failed = True
              reason = f"Identified {counts[\"high\"]} High and {counts[\"medium\"]} Medium severity alert(s)."

          if failed:
              error_msg = f"❌ DAST Policy Violation: {reason}"
              print(error_msg)
              if step_summary:
                  with open(step_summary, "a", encoding="utf-8") as f:
                      f.write(f"\n> ❌ **DAST Security Policy Violation**: {reason}\n")
              sys.exit(1)
          else:
              print(f"✅ DAST Security Check passed under policy threshold: {fail_severity}.")
          '

      - name: Upload Step 2 — OWASP ZAP DAST Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-owasp-zap-dast-reports-run-${{ github.run_id }}
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

      - name: Shutdown Local Application Process
        if: always()
        run: |
          if [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null; then
            echo "Stopping application PID $APP_PID..."
            kill -TERM "$APP_PID" 2>/dev/null || kill -KILL "$APP_PID" 2>/dev/null || true
          fi

  # =========================================================================
  # Job 3: Security Gate / Overall PR Status Check & AI Report Generation
  # =========================================================================
  security_gate:
    name: "3. Security Gate & AI Failure Report"
    runs-on: ubuntu-latest
    needs: [sonar_sast, dast_zap]
    if: always()
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download DAST Reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: step2-owasp-zap-dast-reports-run-${{ github.run_id }}
          path: owasp-zap-dast-reports

      - name: Generate AI-Ready Failure & Security Report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ZAP_REPORT="owasp-zap-dast-reports/report_json.json"

          python3 scripts/generate_pipeline_report.py \
            --repo "${{ github.repository }}" \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --sonar-project-key "${{ inputs.sonar_project_key }}" \
            --sonar-org "${{ inputs.sonar_organization }}" \
            --sonar-token "$SONAR_TOKEN" \
            --zap-report "$ZAP_REPORT" \
            --validate-status "none" \
            --sonar-status "${{ needs.sonar_sast.result }}" \
            --dast-status "${{ needs.dast_zap.result }}" \
            --output-dir "pipeline-reports"

      - name: Upload Step 3 — AI-Ready Full Pipeline Failure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3-ai-full-report-pr-${{ github.event.pull_request.number || 'push' }}-run-${{ github.run_id }}
          path: |
            pipeline-reports/pipeline-report.html
            pipeline-reports/pipeline-report.json
          retention-days: 30

      - name: Consolidate Security Check Results
        env:
          SONAR_RESULT: ${{ needs.sonar_sast.result }}
          DAST_RESULT: ${{ needs.dast_zap.result }}
        run: |
          echo "=============================================="
          echo "       SECURITY GATE STATUS EVALUATION        "
          echo "=============================================="
          echo "1. SonarQube SAST:      $SONAR_RESULT"
          echo "2. OWASP ZAP DAST:      $DAST_RESULT"
          echo "=============================================="

          python3 -c '
          import os, sys

          sonar = os.environ.get("SONAR_RESULT", "failure")
          dast = os.environ.get("DAST_RESULT", "failure")
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")

          def format_status(res):
              if res == "success":
                  return "✅ PASSED"
              elif res == "skipped":
                  return "⏭️ SKIPPED"
              elif res == "cancelled":
                  return "🚫 CANCELLED"
              else:
                  return "❌ FAILED"

          all_passed = (sonar == "success" and dast == "success")

          md = []
          md.append("## 🛡️ Pull Request Security Gate Evaluation\n\n")
          md.append("| Security Check | Status | Requirement Level |\n|---|---|---|\n")
          md.append(f"| **1. SonarQube Cloud SAST Quality Gate** | {format_status(sonar)} | Mandatory |\n")
          md.append(f"| **2. OWASP ZAP DAST Dynamic Scan** | {format_status(dast)} | Mandatory |\n\n")

          if all_passed:
              md.append("> ### 🚀 Overall Status: APPROVED FOR MERGE\n")
              md.append("> All required static and dynamic security checks have passed successfully. No blocking vulnerabilities were detected.\n")
          else:
              md.append("> ### ⛔ Overall Status: BLOCKED FROM MERGING\n")
              md.append("> One or more required security checks failed. Review the failed jobs above and fix reported issues before requesting approval.\n")

          md.append("\n### 📥 AI-Ready Failure & Security Reports\n")
          md.append("**Artifacts generated per step (ชื่อไฟล์บ่งบอกขั้นตอน):**\n\n")
          md.append("| Artifact | ประกอบด้วย | ใช้สำหรับ |\n|---|---|---|\n")
          md.append("| `step1-sonarqube-sast-report-*` | `issues.json`, `quality-gate-status.json`, `hotspots.json` | SAST scan & SonarQube Quality Gate issues |\n")
          md.append("| `step2-owasp-zap-dast-reports-*` | `report_json.json`, `report_html.html`, `report_md.md` | DAST raw scan results |\n")
          md.append("| `step3-ai-full-report-*` | `pipeline-report.html`, `pipeline-report.json` | Full report รวมทุก step สำหรับ AI (HTML Dashboard + JSON) |\n\n")
          md.append("> **AI Code Fix**: ดาวน์โหลด `step3-ai-full-report-*` → ใช้ `pipeline-report.json` ส่งให้ AI แก้โค้ดได้ทันที\n")

          report_text = "".join(md)
          print(report_text)

          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write(report_text)

          if not all_passed:
              sys.exit(1)
          '
