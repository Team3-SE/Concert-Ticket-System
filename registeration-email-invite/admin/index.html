<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลงทะเบียน Admin</title>
<style>
  :root{
    --blue-600:#2f5cff;
    --blue-700:#1c3fd9;
    --blue-900:#12235c;
    --ink:#1f2430;
    --muted:#8a90a3;
    --line:#e6e9f2;
    --bg-field:#f7f8fc;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Segoe UI","Noto Sans Thai","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1100px 700px at 12% 8%, #dfe7ff 0%, transparent 55%),
      radial-gradient(1000px 700px at 90% 90%, #e6ecff 0%, transparent 55%),
      linear-gradient(135deg,#c9d6ff 0%,#e8ecff 45%,#dfe3ff 100%);
    padding:24px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--card);
    border-radius:20px;
    padding:34px 30px 30px;
    box-shadow:0 30px 60px -20px rgba(30,50,120,.25), 0 2px 8px rgba(30,50,120,.06);
    border:1px solid rgba(255,255,255,.6);
  }
  .badge{
    width:40px;height:40px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--blue-600),var(--blue-900));
    display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;
    box-shadow:0 8px 16px -6px rgba(47,92,255,.5);
  }
  .badge svg{width:20px;height:20px;stroke:#fff;}
  h1{
    font-size:19px;
    margin:0 0 4px;
    color:var(--ink);
    font-weight:700;
  }
  .sub{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 22px;
  }
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .field{margin-bottom:16px;}
  .input-wrap{position:relative;}
  input{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg-field);
    font-size:13.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input::placeholder{color:#b3b8c9;}
  input:focus{
    border-color:var(--blue-600);
    background:#fff;
    box-shadow:0 0 0 3px rgba(47,92,255,.12);
  }
  .toggle{
    position:absolute;
    right:12px;top:50%;
    transform:translateY(-50%);
    font-size:11px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    background:none;border:none;
    padding:2px 4px;
  }
  .toggle:hover{color:var(--blue-600);}
  .hint{
    font-size:11px;
    color:var(--muted);
    margin-top:5px;
  }
  .hint.err{color:#e5484d;display:none;}
  button.submit{
    width:100%;
    margin-top:6px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--blue-600),var(--blue-900));
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.2px;
    box-shadow:0 12px 20px -8px rgba(47,92,255,.55);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button.submit:hover{transform:translateY(-1px);box-shadow:0 16px 26px -8px rgba(47,92,255,.6);}
  button.submit:active{transform:translateY(0);}
  .foot{
    text-align:center;
    margin-top:16px;
    font-size:12px;
    color:var(--muted);
  }
  .foot a{color:var(--blue-600);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h1>บัญชี Admin</h1>
    <p class="sub">ลงทะเบียนเพื่อเข้าถึงระบบจัดการหลังบ้าน</p>

    <form id="adminForm" novalidate>
      <div class="field">
        <label for="admin-username">ชื่อผู้ใช้</label>
        <input id="admin-username" name="username" type="text" placeholder="กรอกชื่อผู้ใช้ของคุณ" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="admin-password">รหัสผ่าน</label>
        <div class="input-wrap">
          <input id="admin-password" name="password" type="password" placeholder="กรอกรหัสผ่านของคุณ" autocomplete="new-password" minlength="8" required>
          <button type="button" class="toggle" data-target="admin-password">แสดง</button>
        </div>
        <p class="hint">อย่างน้อย 8 ตัวอักษร</p>
      </div>

      <div class="field">
        <label for="admin-confirm">ยืนยันรหัสผ่าน</label>
        <div class="input-wrap">
          <input id="admin-confirm" name="confirm" type="password" placeholder="กรอกรหัสผ่านอีกครั้ง" autocomplete="new-password" required>
          <button type="button" class="toggle" data-target="admin-confirm">แสดง</button>
        </div>
        <p class="hint err" id="admin-err">รหัสผ่านไม่ตรงกัน</p>
      </div>

      <button type="submit" class="submit">ลงทะเบียน</button>
    </form>

    <p class="foot">มีบัญชีอยู่แล้ว? <a href="#">เข้าสู่ระบบ</a></p>
  </div>

<script>
  document.querySelectorAll('.toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = document.getElementById(btn.dataset.target);
      const isPw = target.type === 'password';
      target.type = isPw ? 'text' : 'password';
      btn.textContent = isPw ? 'ซ่อน' : 'แสดง';
    });
  });

  document.getElementById('adminForm').addEventListener('submit', function(e){
    e.preventDefault();
    const pw = document.getElementById('admin-password').value;
    const cf = document.getElementById('admin-confirm').value;
    const err = document.getElementById('admin-err');
    if(pw !== cf){
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    alert('ลงทะเบียน Admin สำเร็จ (ตัวอย่าง)');
    this.reset();
  });
</script>
</body>
</html>
