# Redis configuration for Concert Ticketing System
# Role: cache, seat lock (SET NX EX), queue backend, session store

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence (AOF — append-only for durability)
appendonly yes
appendfsync everysec

# Max memory & eviction policy
# Keep seat locks / queue jobs safe — only evict keys with TTL
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Slow query log (> 10ms)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable dangerous commands in production (uncomment when deploying)
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""
# rename-command DEBUG    ""
