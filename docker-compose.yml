version: '3.9'

services:
  # ─────────────────────────────────────────────────────────
  # PayMock Gateway (port 8081) – SQLite, แยก Server ชัดเจน
  # ─────────────────────────────────────────────────────────
  paymock:
    build:
      context: ./paymock
      dockerfile: Dockerfile
    container_name: paymock
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_KEY: base64:riofbBnrhWzPVlj6V/NlMJ8mxzut8cLVYJn9AUhrK5U=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8081
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/paymock.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      PAYMOCK_API_KEY: pm_test_key_concert_system_2024
      PAYMOCK_WEBHOOK_SECRET: whsec_concert_super_secret_2024
      PAYMOCK_ADMIN_PASSWORD: admin1234
      PAYMOCK_DEFAULT_EXPIRES_IN: "600"
    ports:
      - "8081:80"
    volumes:
      - paymock_db:/var/www/html/database
      - ./paymock/app:/var/www/html/app
      - ./paymock/routes:/var/www/html/routes
      - ./paymock/resources:/var/www/html/resources
      - ./paymock/config:/var/www/html/config
      - ./paymock/public:/var/www/html/public
      - ./paymock/database/migrations:/var/www/html/database/migrations
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────
  # PayMock Queue Worker (ส่ง Webhook พร้อม Exponential Backoff)
  # ─────────────────────────────────────────────────────────
  paymock_queue:
    build:
      context: ./paymock
      dockerfile: Dockerfile
    container_name: paymock_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=6", "--max-time=3600"]
    environment:
      APP_ENV: local
      APP_KEY: base64:riofbBnrhWzPVlj6V/NlMJ8mxzut8cLVYJn9AUhrK5U=
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/paymock.sqlite
      QUEUE_CONNECTION: database
      PAYMOCK_API_KEY: pm_test_key_concert_system_2024
      PAYMOCK_WEBHOOK_SECRET: whsec_concert_super_secret_2024
    volumes:
      - paymock_db:/var/www/html/database
      - ./paymock/app:/var/www/html/app
      - ./paymock/routes:/var/www/html/routes
      - ./paymock/config:/var/www/html/config
      - ./paymock/database/migrations:/var/www/html/database/migrations
    depends_on:
      paymock:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────
  # PayMock Scheduler (ตรวจสอบ payment ที่หมดอายุ)
  # ─────────────────────────────────────────────────────────
  paymock_scheduler:
    build:
      context: ./paymock
      dockerfile: Dockerfile
    container_name: paymock_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: local
      APP_KEY: base64:riofbBnrhWzPVlj6V/NlMJ8mxzut8cLVYJn9AUhrK5U=
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/paymock.sqlite
      QUEUE_CONNECTION: database
      PAYMOCK_API_KEY: pm_test_key_concert_system_2024
      PAYMOCK_WEBHOOK_SECRET: whsec_concert_super_secret_2024
    volumes:
      - paymock_db:/var/www/html/database
      - ./paymock/app:/var/www/html/app
      - ./paymock/routes:/var/www/html/routes
      - ./paymock/config:/var/www/html/config
      - ./paymock/database/migrations:/var/www/html/database/migrations
    depends_on:
      paymock:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────
  # Mock Concert App & Backend (port 5000) – PHP Backend จำลองระบบคอนเสิร์ต
  # ─────────────────────────────────────────────────────────
  concert_backend:
    build:
      context: ./paymock
      dockerfile: Dockerfile
    container_name: concert_backend
    restart: unless-stopped
    entrypoint: []
    command: ["php", "-S", "0.0.0.0:5000", "-t", "/var/www/concert"]
    environment:
      PAYMOCK_URL: "http://paymock:80/v1/payments"
      MY_WEBHOOK_URL: "http://concert_backend:5000/api/webhook"
    ports:
      - "5000:5000"
    volumes:
      - ./mock-concert-backend:/var/www/concert
    networks:
      default:
        aliases:
          - concert
          - concert_backend
    depends_on:
      paymock:
        condition: service_healthy

volumes:
  paymock_db:

