services:

  # --- Laravel / PHP-FPM -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: concert_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-local}
    networks:
      - concert_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- NGINX -------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: concert_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - concert_network
    depends_on:
      - app

  # --- MySQL -------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: concert_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-concert_db}
      MYSQL_USER: ${DB_USERNAME:-concert_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - concert_mysql_data4:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concert_network

  # --- Redis -------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: concert_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - concert_redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concert_network

# --- Named Volumes (persistent storage) ----------------------------------------
volumes:
  concert_mysql_data4:
    driver: local
  concert_redis_data:
    driver: local

# --- Network -------------------------------------------------------------------
networks:
  concert_network:
    driver: bridge
