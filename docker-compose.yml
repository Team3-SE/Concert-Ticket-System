services:

  # --- Laravel / PHP-FPM -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: concert_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - concert_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- NGINX -------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: concert_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - concert_network
    depends_on:
      - app

  # --- Node (build CSS/JS ด้วย Vite) --------------------------------------------
  # ตอน docker-compose up จะรัน npm install + npm run build แล้วหยุดเอง
  # ผลลัพธ์อยู่ที่ public/build/ (ต้องมีไฟล์นี้ ไม่งั้นหน้าเว็บขึ้น "Vite manifest not found")
  # แก้ CSS/JS ใน resources/ แล้วสั่ง build ใหม่:  docker-compose run --rm node npm run build
  node:
    image: node:22-bookworm-slim
    container_name: concert_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - concert_node_modules:/var/www/html/node_modules   # แยก node_modules ของ container ออกจากเครื่อง
    command: sh -c "npm install --no-audit --no-fund && npm run build"
    restart: "no"

  # --- MySQL -------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: concert_db
    restart: unless-stopped
    # ใช้เวลาประเทศไทยเป็นค่าเริ่มต้นของ MySQL (มีผลกับ NOW() ตอน import ไฟล์ mock ผ่าน Workbench ด้วย)
    command: ["--default-time-zone=+07:00"]
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-concert_db}
      MYSQL_USER: ${DB_USERNAME:-concert_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - concert_mysql_data7:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concert_network

  # --- Redis -------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: concert_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - concert_redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concert_network

# --- Mailpit (รับอีเมลทดสอบ ดูได้ที่ http://localhost:8025) --------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: concert_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - concert_network

# --- Named Volumes (persistent storage) ----------------------------------------
volumes:
  concert_mysql_data7:
    driver: local
  concert_redis_data:
    driver: local
  concert_node_modules:
    driver: local

# --- Network -------------------------------------------------------------------
networks:
  concert_network:
    driver: bridge
